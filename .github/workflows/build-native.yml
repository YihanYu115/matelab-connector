name: Build native Connector

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: MatElabConnector-windows-x64.zip
          - os: macos-15
            artifact: MatElabConnector-macos-arm64.zip
          - os: macos-15-intel
            artifact: MatElabConnector-macos-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install ".[dev,build]"
      - name: Run automated checks
        run: python -m pytest -q
      - name: Build native application
        run: python tools/build_native.py
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath dist/MatElabConnector.exe -DestinationPath "dist/${{ matrix.artifact }}"
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/MatElab Connector.app" "dist/${{ matrix.artifact }}"
      - name: Upload native application
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ matrix.artifact }}
          archive: false
