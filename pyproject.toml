[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "matelab-desktop-bridge"
version = "0.1.0"
description = "Durable local submission gateway for MatElab electronic lab notebooks"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MatElab Bridge contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.12,<1",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]

[project.scripts]
matelab-bridge = "matelab_bridge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["matelab_bridge"]

[tool.hatch.build]
include = [
  "matelab_bridge/**/*.py",
  "matelab_bridge/schemas/*.json",
  "matelab_bridge/template_snapshots/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["matelab_bridge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=matelab_bridge --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = [
  "matelab_bridge/cli.py",
  "matelab_bridge/service.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
